name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      release-build:
        description: 'Build release bundles (AppImage/DMG/NSIS) and sign them'
        type: boolean
        default: false
      version:
        description: 'Version to embed in Tauri builds'
        type: string
        default: ''

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,wasm32-unknown-unknown

      - name: Install cargo-make
        run: cargo install cargo-make

      - name: Install cargo-component
        if: inputs.release-build
        run: cargo install cargo-component --locked

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb rpm2cpio cpio

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Create MoonZoon build directories
        run: |
          mkdir -p backend/private
          mkdir -p frontend_dist/_api/pkg

      - name: Build plugin artifacts
        if: inputs.release-build
        run: makers build_plugins

      - name: Check signing key availability
        if: inputs.release-build
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is set (length: ${#TAURI_SIGNING_PRIVATE_KEY} chars)"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is NOT set - updater artifacts will NOT be created"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri app (release bundle)
        if: inputs.release-build
        run: makers tauri-build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUILD_VERSION: ${{ inputs.version }}

      - name: Build Tauri app (CI check)
        if: ${{ !inputs.release-build }}
        run: makers install && NOVYWAVE_PLATFORM=TAURI ./mzoon/bin/mzoon build -f && cargo build -p novywave

      - name: Build Chrome launcher
        run: cargo build --release -p novywave-chrome

      - name: List built artifacts
        run: |
          echo "=== Chrome launcher ==="
          ls -la target/release/novywave-chrome || true
          if [ "${{ inputs.release-build }}" = "true" ]; then
            echo "=== Bundle directory ==="
            ls -la target/release/bundle/ || true
            echo "=== AppImage ==="
            ls -la target/release/bundle/appimage/ || true
            echo "=== Deb ==="
            ls -la target/release/bundle/deb/ || true
            echo "=== RPM ==="
            ls -la target/release/bundle/rpm/ || true
          fi

      - name: Verify Tauri AppImage startup
        if: inputs.release-build
        run: |
          set -euo pipefail
          APPIMAGE="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' ! -name '*.sig' | head -1)"
          if [ -z "$APPIMAGE" ]; then
            echo "No Tauri AppImage found under target/release/bundle/appimage"
            exit 1
          fi
          APPIMAGE_EXTRACT_AND_RUN=1 \
          NOVYWAVE_SMOKE_TIMEOUT_SECONDS=60 \
          scripts/smoke_tauri_package.sh "$APPIMAGE"

      - name: Verify Tauri deb startup
        if: inputs.release-build
        run: |
          set -euo pipefail
          DEB="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -1)"
          if [ -z "$DEB" ]; then
            echo "No Tauri deb found under target/release/bundle/deb"
            exit 1
          fi
          NOVYWAVE_SMOKE_TIMEOUT_SECONDS=60 \
          scripts/smoke_tauri_linux_package.sh "$DEB"

      - name: Verify Tauri rpm startup
        if: inputs.release-build
        run: |
          set -euo pipefail
          RPM="$(find target/release/bundle/rpm -maxdepth 1 -name '*.rpm' | head -1)"
          if [ -z "$RPM" ]; then
            echo "No Tauri rpm found under target/release/bundle/rpm"
            exit 1
          fi
          NOVYWAVE_SMOKE_TIMEOUT_SECONDS=60 \
          scripts/smoke_tauri_linux_package.sh "$RPM"

      - name: Build Chrome launcher AppImage
        if: inputs.release-build
        run: makers chrome-appimage
        env:
          TAURI_BUILD_VERSION: ${{ inputs.version }}

      - name: Verify Chrome launcher AppImage
        if: inputs.release-build
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          APPIMAGE="target/release/NovyWave_${VERSION}_chrome-linux-x64.AppImage"
          VERIFY_DIR="$(mktemp -d)"
          cp "$APPIMAGE" "$VERIFY_DIR/"
          cd "$VERIFY_DIR"

          "./$(basename "$APPIMAGE")" --appimage-extract >/dev/null
          test -x squashfs-root/usr/lib/novywave/novywave-chrome-linux-x64
          test -x squashfs-root/usr/lib/novywave/backend
          test -f squashfs-root/usr/lib/novywave/frontend_dist/index.html
          test -f squashfs-root/usr/lib/novywave/_api/pkg/build_id
          if grep -R "window.__TAURI__" squashfs-root/usr/lib/novywave/frontend_dist/_api/pkg >/dev/null 2>&1; then
            echo "Chrome AppImage contains Tauri frontend bindings"
            exit 1
          fi
          if grep -R "127.0.0.1:8082" squashfs-root/usr/lib/novywave/frontend_dist/_api/pkg >/dev/null 2>&1; then
            echo "Chrome AppImage frontend is pinned to the dev server port 8082"
            exit 1
          fi
          test -d squashfs-root/usr/lib/novywave/plugins/dist

          cat > fake-chromium <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "--version" ]; then
            echo "Chromium 120.0.6099.224"
            exit 0
          fi
          printf '%s\n' "$*" > "${NOVYWAVE_FAKE_CHROME_LOG:?}"
          app_url=""
          for arg in "$@"; do
            case "$arg" in
              --app=*) app_url="${arg#--app=}" ;;
            esac
          done
          if [ -z "$app_url" ]; then
            echo "missing --app URL" > "${NOVYWAVE_FAKE_CHROME_ROUTE_LOG:?}"
            exit 1
          fi
          for path in "/" "/_api/pkg/build_id"; do
            if ! curl --fail --silent --show-error --max-time 10 "${app_url}${path}" >/dev/null; then
              echo "route failed: ${app_url}${path}" > "${NOVYWAVE_FAKE_CHROME_ROUTE_LOG:?}"
              exit 1
            fi
          done
          printf 'routes ok: %s\n' "$app_url" > "${NOVYWAVE_FAKE_CHROME_ROUTE_LOG:?}"
          exit 0
          EOF
          sed -i 's/^          //' fake-chromium
          chmod +x fake-chromium

          NOVYWAVE_CHROME="$PWD/fake-chromium" \
          NOVYWAVE_FAKE_CHROME_LOG="$PWD/fake-chrome.log" \
          NOVYWAVE_FAKE_CHROME_ROUTE_LOG="$PWD/fake-chrome-routes.log" \
          XDG_CONFIG_HOME="$PWD/config" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          timeout 30s "./$(basename "$APPIMAGE")"

          grep -q -- "--app=http://127.0.0.1:" fake-chrome.log
          grep -q -- "routes ok: http://127.0.0.1:" fake-chrome-routes.log

      - name: Verify Chrome launcher AppImage with real browser
        if: inputs.release-build
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          APPIMAGE="target/release/NovyWave_${VERSION}_chrome-linux-x64.AppImage"
          NOVYWAVE_SMOKE_TIMEOUT_SECONDS=60 \
          scripts/smoke_chrome_appimage_live.sh "$APPIMAGE"

      - name: Upload Chrome launcher
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: linux-chrome-launcher
          path: target/release/NovyWave_*_chrome-linux-x64.AppImage

      - name: Upload AppImage
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: target/release/bundle/appimage/*.AppImage

      - name: Upload Deb
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: target/release/bundle/deb/*.deb

      - name: Upload RPM
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: linux-rpm
          path: target/release/bundle/rpm/*.rpm

      - name: Upload Updater artifacts (AppImage + signature)
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: linux-updater
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig

  build-macos-arm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,wasm32-unknown-unknown

      - name: Install cargo-make
        run: cargo install cargo-make

      - name: Install cargo-component
        if: inputs.release-build
        run: cargo install cargo-component --locked

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Create MoonZoon build directories
        run: |
          mkdir -p backend/private
          mkdir -p frontend_dist/_api/pkg

      - name: Build plugin artifacts
        if: inputs.release-build
        run: makers build_plugins

      - name: Check signing key availability
        if: inputs.release-build
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is set (length: ${#TAURI_SIGNING_PRIVATE_KEY} chars)"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is NOT set - updater artifacts will NOT be created"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri app (release bundle)
        if: inputs.release-build
        run: makers tauri-build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUILD_VERSION: ${{ inputs.version }}

      - name: Build Tauri app (CI check)
        if: ${{ !inputs.release-build }}
        run: makers install && NOVYWAVE_PLATFORM=TAURI ./mzoon/bin/mzoon build -f && cargo build -p novywave

      - name: Build Chrome launcher
        run: cargo build --release -p novywave-chrome

      - name: Rename updater artifacts with architecture suffix
        if: inputs.release-build
        run: |
          cd target/release/bundle/macos
          for f in *.tar.gz; do
            [ -f "$f" ] && mv "$f" "${f%.tar.gz}_aarch64.tar.gz"
          done
          for f in *.tar.gz.sig; do
            [ -f "$f" ] && mv "$f" "${f%.tar.gz.sig}_aarch64.tar.gz.sig"
          done

      - name: Package Chrome launcher
        if: inputs.release-build
        run: |
          makers build
          VERSION="${{ inputs.version }}"
          PACKAGE_NAME="NovyWave_${VERSION}_chrome-macos-aarch64"
          scripts/package_chrome_directory.sh \
            "$PACKAGE_NAME" \
            target/release/novywave-chrome \
            novywave-chrome-macos-aarch64 \
            target/release/backend \
            backend \
            target/release/chrome-package
          tar -C target/release/chrome-package -czf "target/release/${PACKAGE_NAME}.tar.gz" "$PACKAGE_NAME"

      - name: Verify Tauri DMG startup (ARM)
        if: inputs.release-build
        run: |
          set -euo pipefail
          DMG="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)"
          if [ -z "$DMG" ]; then
            echo "No Tauri DMG found under target/release/bundle/dmg"
            exit 1
          fi
          NOVYWAVE_SMOKE_TIMEOUT_SECONDS=60 \
          scripts/smoke_tauri_macos_package.sh "$DMG"

      - name: Upload Chrome launcher (ARM)
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: macos-chrome-launcher-arm
          path: target/release/NovyWave_*_chrome-macos-aarch64.tar.gz

      - name: Upload DMG (ARM)
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg-arm
          path: target/release/bundle/dmg/*.dmg

      - name: Upload Updater artifacts (ARM)
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: macos-updater-arm
          path: |
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.tar.gz.sig


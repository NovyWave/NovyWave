  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,wasm32-unknown-unknown

      - name: Install cargo-make
        run: cargo install cargo-make

      - name: Install cargo-component
        if: inputs.release-build
        run: cargo install cargo-component --locked

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Create MoonZoon build directories
        shell: bash
        run: |
          mkdir -p backend/private
          mkdir -p frontend_dist/_api/pkg

      - name: Build plugin artifacts
        if: inputs.release-build
        shell: bash
        run: makers build_plugins

      - name: Check signing key availability
        if: inputs.release-build
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is set (length: ${#TAURI_SIGNING_PRIVATE_KEY} chars)"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is NOT set - updater artifacts will NOT be created"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri app (release bundle)
        if: inputs.release-build
        shell: bash
        run: makers tauri-build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUILD_VERSION: ${{ inputs.version }}

      - name: Build Tauri app (CI check)
        if: ${{ !inputs.release-build }}
        shell: bash
        run: makers install && NOVYWAVE_PLATFORM=TAURI ./mzoon/bin/mzoon build -f && cargo build -p novywave

      - name: Build Chrome launcher
        shell: bash
        run: cargo build --release -p novywave-chrome

      - name: List built artifacts
        if: inputs.release-build
        shell: bash
        run: |
          echo "=== Bundle directory ==="
          ls -la target/release/bundle/ || echo "No bundle dir"
          echo "=== MSI ==="
          ls -la target/release/bundle/msi/ || echo "No msi dir"
          echo "=== NSIS ==="
          ls -la target/release/bundle/nsis/ || echo "No nsis dir"

      - name: Verify Windows installers contain backend
        if: inputs.release-build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Assert-InstalledBackend {
            param(
              [Parameter(Mandatory = $true)][string]$Root,
              [Parameter(Mandatory = $true)][string]$Label
            )

            if (-not (Test-Path $Root)) {
              throw "$Label root does not exist: $Root"
            }

            $app = Get-ChildItem -Path $Root -Recurse -Filter "NovyWave.exe" -File | Select-Object -First 1
            if (-not $app) {
              Write-Host "$Label files:"
              Get-ChildItem -Path $Root -Recurse | Select-Object -First 120 | Format-Table FullName
              throw "$Label layout does not contain NovyWave.exe"
            }

            $backend = Get-ChildItem -Path $Root -Recurse -Filter "backend.exe" -File | Select-Object -First 1
            if (-not $backend) {
              Write-Host "$Label files:"
              Get-ChildItem -Path $Root -Recurse | Select-Object -First 120 | Format-Table FullName
              throw "$Label layout does not contain backend.exe"
            }

            $relativeApp = [System.IO.Path]::GetRelativePath($Root, $app.FullName)
            $relativeBackend = [System.IO.Path]::GetRelativePath($Root, $backend.FullName)
            Write-Host "$Label NovyWave.exe: $relativeApp"
            Write-Host "$Label backend.exe: $relativeBackend"
            return $app.FullName
          }

          $nsis = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $nsis) {
            throw "No NSIS installer found under target/release/bundle/nsis"
          }
          $nsisInstallDir = Join-Path $env:RUNNER_TEMP "NovyWaveNsisInstall"
          New-Item -ItemType Directory -Force -Path $nsisInstallDir | Out-Null
          $nsisProcess = Start-Process -FilePath $nsis.FullName -ArgumentList @("/S", "/D=$nsisInstallDir") -Wait -PassThru
          if ($nsisProcess.ExitCode -ne 0) {
            throw "NSIS installer exited with $($nsisProcess.ExitCode)"
          }
          $nsisApp = Assert-InstalledBackend -Root $nsisInstallDir -Label "NSIS install"
          scripts/smoke_tauri_windows_package.ps1 -AppPath $nsisApp -Label "NSIS install"

          $msi = Get-ChildItem -Path "target/release/bundle/msi" -Filter "*.msi" -File | Select-Object -First 1
          if (-not $msi) {
            throw "No MSI artifact found under target/release/bundle/msi"
          }
          $msiExtractDir = Join-Path $env:RUNNER_TEMP "NovyWaveMsiExtract"
          New-Item -ItemType Directory -Force -Path $msiExtractDir | Out-Null
          $msiProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/a", $msi.FullName, "/qn", "TARGETDIR=$msiExtractDir") -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) {
            throw "MSI administrative extraction exited with $($msiProcess.ExitCode)"
          }
          $msiApp = Assert-InstalledBackend -Root $msiExtractDir -Label "MSI extraction"
          scripts/smoke_tauri_windows_package.ps1 -AppPath $msiApp -Label "MSI extraction"

      - name: Package Chrome launcher
        if: inputs.release-build
        shell: bash
        run: |
          makers build
          VERSION="${{ inputs.version }}"
          PACKAGE_NAME="NovyWave_${VERSION}_chrome-windows-x64"
          scripts/package_chrome_directory.sh \
            "$PACKAGE_NAME" \
            target/release/novywave-chrome.exe \
            novywave-chrome-windows-x64.exe \
            target/release/backend.exe \
            backend.exe \
            target/release/chrome-package
          powershell -NoProfile -Command "Compress-Archive -Path 'target/release/chrome-package/${PACKAGE_NAME}' -DestinationPath 'target/release/${PACKAGE_NAME}.zip' -Force"

      - name: Upload Chrome launcher (Windows)
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: windows-chrome-launcher
          path: target/release/NovyWave_*_chrome-windows-x64.zip

      - name: Upload MSI
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: target/release/bundle/msi/*.msi

      - name: Upload NSIS installer
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe

      - name: Upload Updater artifacts (Windows)
        if: inputs.release-build
        uses: actions/upload-artifact@v7
        with:
          name: windows-updater
          if-no-files-found: warn
          path: |
            target/release/bundle/nsis/*.sig

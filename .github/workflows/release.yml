name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read and validate version
        id: version
        run: |
          set -e

          # Read version from Cargo.toml
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::Version not found in Cargo.toml"
            exit 1
          fi

          # Read version from tauri.conf.json
          TAURI_VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"\([0-9][0-9.]*\)".*/\1/')
          if [ -z "$TAURI_VERSION" ]; then
            echo "::error::Version not found in src-tauri/tauri.conf.json"
            exit 1
          fi

          # Check versions match
          if [ "$CARGO_VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::Version mismatch: Cargo.toml has $CARGO_VERSION but tauri.conf.json has $TAURI_VERSION"
            exit 1
          fi

          echo "Release version: $CARGO_VERSION"

          # If triggered by tag, verify tag matches code
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::Tag v$TAG_VERSION does not match code version $CARGO_VERSION — update Cargo.toml and tauri.conf.json first"
              exit 1
            fi
          fi

          # Get the latest existing release tag
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            LATEST_VERSION="${LATEST_TAG#v}"
            echo "Latest released version: $LATEST_VERSION"

            # Compare versions using sort -V
            HIGHER=$(printf '%s\n%s' "$LATEST_VERSION" "$CARGO_VERSION" | sort -V | tail -1)
            if [ "$CARGO_VERSION" = "$LATEST_VERSION" ]; then
              echo "::error::Version $CARGO_VERSION is the same as the latest release — bump the version in Cargo.toml and tauri.conf.json"
              exit 1
            elif [ "$HIGHER" = "$LATEST_VERSION" ]; then
              echo "::error::Version $CARGO_VERSION is lower than the latest release $LATEST_VERSION — bump the version in Cargo.toml and tauri.conf.json"
              exit 1
            fi
            echo "Version $CARGO_VERSION is newer than $LATEST_VERSION"
          else
            echo "No previous release tags found — first release"
          fi

          echo "version=$CARGO_VERSION" >> $GITHUB_OUTPUT

  build:
    needs: validate-version
    uses: ./.github/workflows/build.yml
    with:
      release-build: true
      version: ${{ needs.validate-version.outputs.version }}
    secrets: inherit

  create-release:
    needs: [validate-version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Install updater verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Generate unified latest.json for updater
        run: |
          scripts/generate_updater_latest.py \
            --artifacts artifacts \
            --version "${{ needs.validate-version.outputs.version }}" \
            --release-url-base "https://github.com/NovyWave/NovyWave/releases/download/v${{ needs.validate-version.outputs.version }}" \
            --output artifacts/latest.json

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f | while read f; do
            cp "$f" "release-files/$(basename "$f")"
          done
          echo "=== Release files ==="
          ls -la release-files/

      - name: Create draft release
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          cat > /tmp/release-notes.md << 'NOTES'
          ## Downloads

          | Platform | File |
          |----------|------|
          | **Linux** | |
          | AppImage | `NovyWave_VERSION_amd64.AppImage` |
          | Debian/Ubuntu | `novywave_VERSION_amd64.deb` |
          | Fedora/RHEL | `novywave-VERSION-1.x86_64.rpm` |
          | Chrome launcher AppImage | `NovyWave_VERSION_chrome-linux-x64.AppImage` |
          | **macOS** | |
          | Apple Silicon (M1/M2/M3) | `NovyWave_VERSION_aarch64.dmg` |
          | Intel | `NovyWave_VERSION_x64.dmg` |
          | Chrome launcher (ARM) | `NovyWave_VERSION_chrome-macos-aarch64.tar.gz` |
          | Chrome launcher (Intel) | `NovyWave_VERSION_chrome-macos-x64.tar.gz` |
          | **Windows** | |
          | Installer (NSIS) | `NovyWave_VERSION_x64-setup.exe` |
          | MSI | `NovyWave_VERSION_x64_en-US.msi` |
          | Chrome launcher | `NovyWave_VERSION_chrome-windows-x64.zip` |

          ## Chrome Launcher

          `novywave-chrome` is a one-file Linux AppImage alternative that opens NovyWave in Chrome/Chromium app mode.
          Use it if the standard desktop app has performance issues (especially on Linux).
          It requires Chrome, Chromium, Edge, Brave, or another Chromium-based browser installed.

          ## Auto-Update

          Auto-update is available for Linux AppImage, macOS app, and Windows NSIS installs.
          Debian, RPM, and MSI installs update manually by downloading the new package from this release.
          NOTES
          sed -i "s/VERSION/$VERSION/g" /tmp/release-notes.md

          gh release create "v${VERSION}" \
            --title "NovyWave v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --draft \
            release-files/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

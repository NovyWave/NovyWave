[package]
name = "release-tools"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Release artifact validation and metadata tooling for NovyWave"

[[bin]]
name = "novywave-release"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
